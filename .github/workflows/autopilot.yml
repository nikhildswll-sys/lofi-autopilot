name: YouTube Lo-Fi Autopilot

on:
  schedule:
    # Runs every 3 hours round-the-clock (Fresh Release Radar)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Deno (YouTube Signature JS Runtime)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install System Dependencies (FFmpeg & Rubberband)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librubberband-dev fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --upgrade yt-dlp

      - name: Restore YouTube OAuth Credentials & Cookies from Secrets
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$CLIENT_SECRETS_JSON" ] || [ -z "$TOKEN_JSON" ]; then
            echo "ERROR: GitHub Secrets CLIENT_SECRETS_JSON or TOKEN_JSON is missing!"
            echo "Please add them in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$TOKEN_JSON" > token.json
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "YouTube cookies loaded successfully."
          fi
          echo "Credentials restored successfully without exposing secrets in logs."

      - name: Run Autopilot Bot (Fresh Release Radar)
        run: |
          python autopilot.py --count 1

      - name: Clean sensitive credentials before finish
        if: always()
        run: |
          rm -f client_secrets.json token.json cookies.txt

      - name: Commit & Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Auto: Update history.json with newly uploaded songs [skip ci]" || echo "No history changes to commit"
          git push
