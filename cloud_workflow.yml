name: YouTube Daily 4 Videos Autopilot

on:
  schedule:
    # Runs 4 times a day: 4:30 AM, 10:30 AM, 3:30 PM, 8:30 PM (IST)
    - cron: '0 23,5,10,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime!

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Inject Permanent YouTube Token Secret
        env:
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json

      - name: Run Autopilot Bot (Processes & Uploads to YouTube)
        run: |
          python autopilot.py

      - name: Commit & Push Updated History
        run: |
          git config --global user.name "LofiBot"
          git config --global user.email "bot@lofi.local"
          git add history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update song history [skip ci]"
          git push
